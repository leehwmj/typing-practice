<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>타자 연습기 - 단어 목록</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-card .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .search-info {
            padding: 15px 20px;
            background: #f0f4ff;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }

        .search-info p {
            font-size: 15px;
            color: #333;
            margin: 0;
        }

        .search-info strong {
            color: #667eea;
            font-weight: 600;
        }

        .controls {
            padding: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-btn {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            padding: 20px;
        }

        .word-card {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .word-card:hover {
            background: #e8ecff;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .word-card .word {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .word-card .chars {
            font-size: 12px;
            color: #999;
            word-break: break-all;
            line-height: 1.4;
        }

        .word-card .length {
            font-size: 11px;
            color: #667eea;
            margin-top: 8px;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-results p {
            font-size: 16px;
        }
    </style>
</head>

            <div class="stat-card">

        </div>

        <div class="search-info">

        </div>

        <div class="controls">
            <input type="text" class="search-box" id="searchInput" placeholder="단어 검색... (예: 터널, 고양)">
            <button class="filter-btn active" data-filter="all">모든 단어</button>
            <button class="filter-btn" data-filter="1-2">1-2글자</button>
            <button class="filter-btn" data-filter="3-4">3-4글자</button>
            <button class="filter-btn" data-filter="5">5글자 이상</button>
        </div>

        <div class="word-grid" id="wordGrid">

    </div>

        let filteredWords = words;
        let currentFilter = 'all';

        const updateStats = () => {
            const uniqueChars = new Set();
            words.forEach(w => {
                w.characters.forEach(c => uniqueChars.add(c));
            });

            const wordLengths = words.map(w => w.word.length);
            const avgLength = (wordLengths.reduce((a, b) => a + b, 0) / words.length).toFixed(1);
            const maxLength = Math.max(...wordLengths);

            document.getElementById('totalCount').textContent = words.length;
            document.getElementById('charCount').textContent = uniqueChars.size;
            document.getElementById('avgLength').textContent = avgLength;
            document.getElementById('maxLength').textContent = maxLength;
        };

        const renderWords = () => {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            // 검색 결과 개수 업데이트
            document.getElementById('searchCount').textContent = filteredWords.length;

            if (filteredWords.length === 0) {
                grid.innerHTML = '<div class="no-results" style="grid-column: 1/-1"><p>검색 결과가 없습니다</p></div>';
                return;
            }

            filteredWords.forEach(word => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="word">${word.word}</div>
                    <div class="chars">${word.characters.join(' ')}</div>
                    <div class="length">${word.word.length}글자</div>
                `;
                grid.appendChild(card);
            });
        };

        const applyFilters = () => {
            const searchTerm = document.getElementById('searchInput').value;

            filteredWords = words.filter(word => {
                // 단어 단위 검색
                const matchesWordSearch = word.word.includes(searchTerm);

                // 자모 단위 검색 (정확히 일치하는 자모)
                const matchesCharSearch = searchTerm.length > 0 && word.characters.includes(searchTerm);

                const matchesSearch = matchesWordSearch || matchesCharSearch;

                if (currentFilter === 'all') return matchesSearch;
                if (currentFilter === '1-2') return matchesSearch && word.word.length <= 2;
                if (currentFilter === '3-4') return matchesSearch && word.word.length >= 3 && word.word.length <= 4;
                if (currentFilter === '5') return matchesSearch && word.word.length >= 5;

                return matchesSearch;
            });

            renderWords();
        };

        document.getElementById('searchInput').addEventListener('input', applyFilters);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        updateStats();
        // 초기 로드 시 전체 단어 개수 표시
        document.getElementById('searchCount').textContent = words.length;
        renderWords();
